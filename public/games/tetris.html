<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tetris Falling Blocks</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #030712;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 10px;
    }
    .game-layout {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      max-width: 440px;
    }
    .board-box {
      position: relative;
      border: 2px solid #1e293b;
      border-radius: 8px;
      background: #020617;
      box-shadow: 0 0 24px rgba(168, 85, 247, 0.15);
      overflow: hidden;
    }
    canvas { display: block; }
    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 110px;
    }
    .stat-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 8px;
      text-align: center;
    }
    .stat-card span { font-size: 10px; color: #94a3b8; font-weight: 700; display: block; }
    .stat-card b { font-size: 15px; color: #a855f7; font-variant-numeric: tabular-nums; }
    .btn {
      background: #9333ea;
      color: #ffffff;
      border: none;
      padding: 8px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.88);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
    }
    .overlay h2 { font-size: 20px; font-weight: 800; color: #a855f7; margin-bottom: 6px; }
    .overlay p { font-size: 11px; color: #94a3b8; margin-bottom: 12px; }
    .hint { margin-top: 10px; font-size: 11px; color: #64748b; text-align: center; }
  </style>
</head>
<body>
  <div class="game-layout">
    <div class="board-box">
      <canvas id="tetrisCanvas" width="200" height="400"></canvas>
      <div id="overlay" class="overlay">
        <h2 id="overlay-title">BLOCK STACKER</h2>
        <p id="overlay-desc">Stack shapes, complete lines, and prevent blocks from reaching the top!</p>
        <button id="start-btn" class="btn">START</button>
      </div>
    </div>

    <div class="side-panel">
      <div class="stat-card">
        <span>SCORE</span>
        <b id="score">0</b>
      </div>
      <div class="stat-card">
        <span>LINES</span>
        <b id="lines">0</b>
      </div>
      <div class="stat-card">
        <span>LEVEL</span>
        <b id="level">1</b>
      </div>
      <div class="stat-card">
        <span>NEXT</span>
        <canvas id="nextCanvas" width="80" height="80" style="margin: 4px auto 0;"></canvas>
      </div>
      <button id="pause-btn" class="btn">PAUSE</button>
    </div>
  </div>

  <div class="hint">&larr; &rarr; to Move &middot; &uarr; to Rotate &middot; &darr; Drop &middot; Space Hard Drop</div>

  <script>
    const canvas = document.getElementById('tetrisCanvas');
    const ctx = canvas.getContext('2d');
    const nextCanvas = document.getElementById('nextCanvas');
    const nextCtx = nextCanvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const linesEl = document.getElementById('lines');
    const levelEl = document.getElementById('level');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('start-btn');

    const COLS = 10;
    const ROWS = 20;
    const BLOCK = 20;

    const COLORS = [
      null,
      '#06b6d4', // I
      '#3b82f6', // J
      '#f97316', // L
      '#eab308', // O
      '#22c55e', // S
      '#a855f7', // T
      '#ef4444'  // Z
    ];

    const PIECES = 'ILJOTSZ';
    function createPiece(type) {
      if (type === 'I') {
        return [
          [0, 1, 0, 0],
          [0, 1, 0, 0],
          [0, 1, 0, 0],
          [0, 1, 0, 0]
        ];
      } else if (type === 'J') {
        return [
          [0, 2, 0],
          [0, 2, 0],
          [2, 2, 0]
        ];
      } else if (type === 'L') {
        return [
          [0, 3, 0],
          [0, 3, 0],
          [0, 3, 3]
        ];
      } else if (type === 'O') {
        return [
          [4, 4],
          [4, 4]
        ];
      } else if (type === 'S') {
        return [
          [0, 5, 5],
          [5, 5, 0],
          [0, 0, 0]
        ];
      } else if (type === 'T') {
        return [
          [0, 6, 0],
          [6, 6, 6],
          [0, 0, 0]
        ];
      } else if (type === 'Z') {
        return [
          [7, 7, 0],
          [0, 7, 7],
          [0, 0, 0]
        ];
      }
    }

    let arena = createMatrix(COLS, ROWS);
    let player = { pos: { x: 0, y: 0 }, matrix: null, score: 0, lines: 0, level: 1 };
    let nextPiece = null;
    let dropCounter = 0;
    let dropInterval = 1000;
    let lastTime = 0;
    let gameRunning = false;

    function createMatrix(w, h) {
      const matrix = [];
      while (h--) matrix.push(new Array(w).fill(0));
      return matrix;
    }

    function collide(arena, player) {
      const [m, o] = [player.matrix, player.pos];
      for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
          if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
            return true;
          }
        }
      }
      return false;
    }

    function merge(arena, player) {
      player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            arena[y + player.pos.y][x + player.pos.x] = value;
          }
        });
      });
    }

    function rotate(matrix, dir) {
      for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) {
          [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
        }
      }
      if (dir > 0) matrix.forEach(row => row.reverse());
      else matrix.reverse();
    }

    function playerRotate(dir) {
      const pos = player.pos.x;
      let offset = 1;
      rotate(player.matrix, dir);
      while (collide(arena, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
          rotate(player.matrix, -dir);
          player.pos.x = pos;
          return;
        }
      }
    }

    function playerDrop() {
      player.pos.y++;
      if (collide(arena, player)) {
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
      }
      dropCounter = 0;
    }

    function playerHardDrop() {
      while (!collide(arena, player)) {
        player.pos.y++;
      }
      player.pos.y--;
      merge(arena, player);
      playerReset();
      arenaSweep();
      dropCounter = 0;
    }

    function arenaSweep() {
      let rowCount = 0;
      outer: for (let y = arena.length - 1; y > 0; --y) {
        for (let x = 0; x < arena[y].length; ++x) {
          if (arena[y][x] === 0) continue outer;
        }
        const row = arena.splice(y, 1)[0].fill(0);
        arena.unshift(row);
        ++y;
        rowCount++;
      }
      if (rowCount > 0) {
        player.lines += rowCount;
        player.score += rowCount * 100 * rowCount;
        player.level = Math.floor(player.lines / 10) + 1;
        dropInterval = Math.max(150, 1000 - (player.level - 1) * 80);
        updateScore();
      }
    }

    function playerReset() {
      if (!nextPiece) {
        nextPiece = createPiece(PIECES[Math.floor(Math.random() * PIECES.length)]);
      }
      player.matrix = nextPiece;
      nextPiece = createPiece(PIECES[Math.floor(Math.random() * PIECES.length)]);
      player.pos.y = 0;
      player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
      drawNext();

      if (collide(arena, player)) {
        gameRunning = false;
        overlay.style.display = 'flex';
        document.getElementById('overlay-title').textContent = 'GAME OVER';
        document.getElementById('overlay-desc').textContent = `Final Score: ${player.score}`;
        startBtn.textContent = 'PLAY AGAIN';
      }
    }

    function updateScore() {
      scoreEl.textContent = player.score;
      linesEl.textContent = player.lines;
      levelEl.textContent = player.level;
    }

    function drawMatrix(matrix, offset, context) {
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            context.fillStyle = COLORS[value];
            context.fillRect((x + offset.x) * BLOCK, (y + offset.y) * BLOCK, BLOCK - 1, BLOCK - 1);
          }
        });
      });
    }

    function drawNext() {
      nextCtx.fillStyle = '#0f172a';
      nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
      if (nextPiece) {
        const offX = (nextCanvas.width / BLOCK - nextPiece[0].length) / 2;
        const offY = (nextCanvas.height / BLOCK - nextPiece.length) / 2;
        drawMatrix(nextPiece, { x: offX, y: offY }, nextCtx);
      }
    }

    function draw() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawMatrix(arena, { x: 0, y: 0 }, ctx);
      if (player.matrix) drawMatrix(player.matrix, player.pos, ctx);
    }

    function update(time = 0) {
      if (!gameRunning) return;
      const deltaTime = time - lastTime;
      lastTime = time;
      dropCounter += deltaTime;
      if (dropCounter > dropInterval) playerDrop();
      draw();
      requestAnimationFrame(update);
    }

    function start() {
      arena = createMatrix(COLS, ROWS);
      player.score = 0;
      player.lines = 0;
      player.level = 1;
      dropInterval = 1000;
      nextPiece = null;
      updateScore();
      playerReset();
      gameRunning = true;
      overlay.style.display = 'none';
      lastTime = performance.now();
      requestAnimationFrame(update);
    }

    window.addEventListener('keydown', e => {
      if (!gameRunning) return;
      if (e.key === 'ArrowLeft' || e.key === 'a') {
        player.pos.x--;
        if (collide(arena, player)) player.pos.x++;
      } else if (e.key === 'ArrowRight' || e.key === 'd') {
        player.pos.x++;
        if (collide(arena, player)) player.pos.x--;
      } else if (e.key === 'ArrowDown' || e.key === 's') {
        playerDrop();
      } else if (e.key === 'ArrowUp' || e.key === 'w') {
        playerRotate(1);
      } else if (e.code === 'Space') {
        e.preventDefault();
        playerHardDrop();
      }
    });

    startBtn.addEventListener('click', start);
    draw();
  </script>
</body>
</html>
