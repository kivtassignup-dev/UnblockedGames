<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Snake Arcade</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 440px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.05em;
    }
    .score-box { display: flex; gap: 16px; }
    .score-val { color: #38bdf8; font-variant-numeric: tabular-nums; }
    .high-val { color: #f59e0b; font-variant-numeric: tabular-nums; }
    #canvas-container {
      position: relative;
      width: 420px;
      height: 420px;
      max-width: 92vw;
      max-height: 92vw;
      border: 2px solid #1e293b;
      border-radius: 12px;
      background: #030712;
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.15);
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(3, 7, 18, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .overlay h2 {
      font-size: 24px;
      font-weight: 800;
      color: #38bdf8;
      margin-bottom: 8px;
    }
    .overlay p {
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .btn {
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn:hover { background: #0369a1; transform: translateY(-1px); }
    .controls-hint {
      margin-top: 14px;
      font-size: 12px;
      color: #64748b;
      text-align: center;
    }
    .touch-controls {
      display: none;
      margin-top: 12px;
      gap: 8px;
      grid-template-columns: repeat(3, 56px);
      grid-template-rows: repeat(2, 52px);
    }
    @media (max-pointer: coarse) {
      .touch-controls { display: grid; }
    }
    .touch-btn {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      border-radius: 8px;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .touch-btn:active { background: #38bdf8; color: #000; }
  </style>
</head>
<body>
  <div class="hud">
    <div class="score-box">
      <div>SCORE: <span id="score" class="score-val">0</span></div>
      <div>BEST: <span id="high-score" class="high-val">0</span></div>
    </div>
    <div id="speed-label" style="color: #64748b; font-size: 12px;">NORMAL</div>
  </div>

  <div id="canvas-container">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div id="overlay" class="overlay">
      <h2 id="overlay-title">NEON SNAKE</h2>
      <p id="overlay-desc">Use Arrow keys or WASD to guide the snake. Eat the neon power orbs without crashing into walls or yourself!</p>
      <button id="start-btn" class="btn">PLAY GAME</button>
    </div>
  </div>

  <div class="controls-hint">Controls: Arrow Keys or WASD &middot; Space to Pause</div>

  <div class="touch-controls">
    <div></div>
    <button class="touch-btn" id="btn-up">&uarr;</button>
    <div></div>
    <button class="touch-btn" id="btn-left">&larr;</button>
    <button class="touch-btn" id="btn-down">&darr;</button>
    <button class="touch-btn" id="btn-right">&rarr;</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('high-score');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayDesc = document.getElementById('overlay-desc');
    const startBtn = document.getElementById('start-btn');

    const GRID = 20;
    const COLS = canvas.width / GRID;
    const ROWS = canvas.height / GRID;

    // Web Audio Sound FX generator
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type = 'sine', duration = 0.08) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    let snake = [];
    let dir = { x: 1, y: 0 };
    let nextDir = { x: 1, y: 0 };
    let food = { x: 0, y: 0, pulse: 0 };
    let score = 0;
    let highScore = parseInt(localStorage.getItem('unblock_snake_high') || '0', 10);
    highScoreEl.textContent = highScore;

    let gameRunning = false;
    let gameLoopId = null;
    let speed = 110;
    let particles = [];

    function spawnFood() {
      let valid = false;
      while (!valid) {
        food.x = Math.floor(Math.random() * COLS);
        food.y = Math.floor(Math.random() * ROWS);
        valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
      }
    }

    function initGame() {
      snake = [
        { x: 8, y: 10 },
        { x: 7, y: 10 },
        { x: 6, y: 10 }
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      speed = 110;
      scoreEl.textContent = score;
      particles = [];
      spawnFood();
      gameRunning = true;
      overlay.style.display = 'none';
      if (gameLoopId) clearInterval(gameLoopId);
      gameLoopId = setInterval(gameStep, speed);
      playBeep(440, 'triangle', 0.1);
    }

    function createExplosion(x, y, color) {
      for (let i = 0; i < 16; i++) {
        const angle = Math.random() * Math.PI * 2;
        const vel = Math.random() * 3 + 1;
        particles.push({
          x: x * GRID + GRID / 2,
          y: y * GRID + GRID / 2,
          vx: Math.cos(angle) * vel,
          vy: Math.sin(angle) * vel,
          life: 25,
          maxLife: 25,
          color: color
        });
      }
    }

    function gameStep() {
      dir = { ...nextDir };
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // Wall collision
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
        gameOver();
        return;
      }

      // Self collision
      if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      // Check food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        if (score > highScore) {
          highScore = score;
          highScoreEl.textContent = highScore;
          localStorage.setItem('unblock_snake_high', highScore);
        }
        createExplosion(food.x, food.y, '#38bdf8');
        playBeep(620, 'sine', 0.1);
        spawnFood();

        // Speed ramp
        if (speed > 60 && score % 40 === 0) {
          speed -= 5;
          clearInterval(gameLoopId);
          gameLoopId = setInterval(gameStep, speed);
        }
      } else {
        snake.pop();
      }

      draw();
    }

    function gameOver() {
      gameRunning = false;
      clearInterval(gameLoopId);
      playBeep(180, 'sawtooth', 0.3);
      createExplosion(snake[0].x, snake[0].y, '#ef4444');
      draw();
      overlayTitle.textContent = 'GAME OVER';
      overlayDesc.textContent = `You scored ${score} points! Best is ${highScore}.`;
      startBtn.textContent = 'PLAY AGAIN';
      overlay.style.display = 'flex';
    }

    function draw() {
      // Background grid
      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 1;
      for (let x = 0; x <= canvas.width; x += GRID) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y <= canvas.height; y += GRID) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      // Draw food
      ctx.save();
      ctx.shadowBlur = 12;
      ctx.shadowColor = '#38bdf8';
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.arc(food.x * GRID + GRID / 2, food.y * GRID + GRID / 2, GRID / 2 - 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Draw snake
      snake.forEach((seg, i) => {
        ctx.save();
        if (i === 0) {
          ctx.fillStyle = '#38bdf8';
          ctx.shadowBlur = 10;
          ctx.shadowColor = '#0284c7';
        } else {
          ctx.fillStyle = '#0ea5e9';
          ctx.shadowBlur = 0;
        }
        ctx.fillRect(seg.x * GRID + 1, seg.y * GRID + 1, GRID - 2, GRID - 2);
        ctx.restore();
      });

      // Draw particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillRect(p.x, p.y, 3, 3);
        ctx.globalAlpha = 1;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    window.addEventListener('keydown', (e) => {
      if (!gameRunning) return;
      if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') && dir.y === 0) {
        nextDir = { x: 0, y: -1 };
        e.preventDefault();
      } else if ((e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') && dir.y === 0) {
        nextDir = { x: 0, y: 1 };
        e.preventDefault();
      } else if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') && dir.x === 0) {
        nextDir = { x: -1, y: 0 };
        e.preventDefault();
      } else if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') && dir.x === 0) {
        nextDir = { x: 1, y: 0 };
        e.preventDefault();
      }
    });

    startBtn.addEventListener('click', initGame);

    document.getElementById('btn-up').addEventListener('click', () => { if (dir.y === 0) nextDir = { x: 0, y: -1 }; });
    document.getElementById('btn-down').addEventListener('click', () => { if (dir.y === 0) nextDir = { x: 0, y: 1 }; });
    document.getElementById('btn-left').addEventListener('click', () => { if (dir.x === 0) nextDir = { x: -1, y: 0 }; });
    document.getElementById('btn-right').addEventListener('click', () => { if (dir.x === 0) nextDir = { x: 1, y: 0 }; });

    draw();
  </script>
</body>
</html>
